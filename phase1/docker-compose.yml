# Monitoring for the serving plane. Both services use host networking so they can
# reach the vLLM engines on pinned localhost ports without a bridge hop.
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/david/gpu-lab/phase1/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.listen-address=0.0.0.0:9090

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - /home/david/gpu-lab/phase1/grafana/provisioning:/etc/grafana/provisioning:ro
      - /home/david/gpu-lab/phase1/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  litellm:
    image: litellm/litellm:v1.100.1
    container_name: litellm
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/gpu-lab/litellm.env      # holds LITELLM_MASTER_KEY; not in git
    volumes:
      - /home/david/gpu-lab/phase1/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]

volumes:
  prometheus-data:
  grafana-data:
